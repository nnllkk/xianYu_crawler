app:
  timezone: Asia/Shanghai
llm:
  default_provider: ollama
  retry_count: 2
  timeout_seconds: 60
  tasks:
    llm1_user_parse:
      provider: ollama
      model: gemma4:latest
    llm1_product_parse:
      provider: ollama
      model: gemma4:latest
    llm2_rank:
      provider: ollama
      model: gemma4:latest
  providers:
    siliconflow:
      base_url: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY
ollama:
  base_url: http://127.0.0.1:11434
  model: gemma4:latest
  context_length: 16384
scheduler:
  poll_interval_minutes: 1
  min_interval_minutes: 10
  max_interval_minutes: 30
  max_task_retries: 3
collector:
  # 闲鱼会拦截当前无头浏览器环境；默认使用可见浏览器进行已授权会话采集。
  headless: false
  # 单次规则最多翻页数，以及等待 LLM 分析时允许缓冲的已采集页面数。
  max_pages: 20 # 闲鱼最多支持翻页 20 页
  page_queue_size: 2 # 等待 LLM 分析时允许缓冲的已采集页面数。
  page_delay_min_seconds: 5
  page_delay_max_seconds: 15
analysis:
  # 通过首次判断的商品累计到该容量后进行排序；首次判断并发受下项限制。
  candidate_pool_size: 20 # 初始次判断商品池容量
  initial_assessment_concurrency: 2 # 初始次判断并发数
xianyu:
  state_dir: data/xianyu_states
  account_cooldown_minutes: 60
