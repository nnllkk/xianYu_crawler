app:
  timezone: Asia/Shanghai
llm:
  default_provider: ollama
  retry_count: 2
  timeout_seconds: 60
  tasks:
    llm1_user_parse:
      provider: ollama
      model: gemma4:latest
    llm1_product_parse:
      provider: ollama
      model: gemma4:latest
    llm2_rank:
      provider: ollama
      model: gemma4:latest
  providers:
    siliconflow:
      base_url: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY
ollama:
  base_url: http://127.0.0.1:11434
  model: gemma4:latest
  context_length: 16384
scheduler:
  poll_interval_minutes: 1
  min_interval_minutes: 10
  max_interval_minutes: 30
  max_task_retries: 3
collector:
  search_delay_min_seconds: 5
  search_delay_max_seconds: 15
xianyu:
  state_dir: data/xianyu_states
  account_cooldown_minutes: 60
