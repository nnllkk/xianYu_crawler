app:
  timezone: Asia/Shanghai
llm:
  default_provider: ollama
  default_model: gemma4:latest
  retry_count: 3
  retry_delay_seconds: 5
  timeout_seconds: 300
  tasks:
    user_requirement:
      provider: ollama
      model: gemma4:latest
      context_length: 4096
    item_assessment:
      provider: ollama
      model: gemma4:latest
      context_length: 4096
    candidate_ranking:
      provider: ollama
      model: gemma4:latest
      context_length: 16384
  providers:
    ollama:
      type: ollama
      base_url: http://127.0.0.1:11434
    siliconflow:
      type: siliconflow
      base_url: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY
scheduler:
  poll_interval_minutes: 1 # 轮询间隔，单位分钟
  min_interval_minutes: 10 # 最小轮询间隔，单位分钟
  max_interval_minutes: 30 # 最大轮询间隔，单位分钟
  max_task_retries: 3 # 最大任务重试次数
collector:
  # 闲鱼会拦截当前无头浏览器环境；默认使用可见浏览器进行已授权会话采集。
  headless: false
  # 原始商品队列。达到 80% 时暂停翻页，降到 20% 后恢复。
  item_queue_size: 60
  page_delay_min_seconds: 5
  page_delay_max_seconds: 15
analysis:
  # 候选队列容量。超过 70% 仅排序；20% 至 70% 初筛和排序并行；低于等于 20% 仅初筛。
  candidate_pool_size: 100
  initial_assessment_concurrency: 2 # 初始次判断并发数
xianyu:
  state_dir: data/xianyu_states
  account_cooldown_minutes: 60
