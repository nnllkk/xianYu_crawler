app:
  timezone: Asia/Shanghai
llm:
  default_provider: ollama
  retry_count: 3
  retry_delay_seconds: 5
  timeout_seconds: 300
  tasks:
    user_requirement:
      provider: ollama
      model: gemma4:latest
      context_length: 4096
    item_assessment:
      provider: ollama
      model: gemma4:latest
      context_length: 4096
    candidate_ranking:
      provider: ollama
      model: gemma4:latest
      context_length: 16384
  providers:
    siliconflow:
      base_url: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY
ollama:
  base_url: http://127.0.0.1:11434
  model: gemma4:latest
scheduler:
  poll_interval_minutes: 1
  min_interval_minutes: 10
  max_interval_minutes: 30
  max_task_retries: 3
collector:
  # 闲鱼会拦截当前无头浏览器环境；默认使用可见浏览器进行已授权会话采集。
  headless: false
  # 原始商品队列。达到 80% 时暂停翻页，降到 20% 后恢复。
  item_queue_size: 60
  page_delay_min_seconds: 5
  page_delay_max_seconds: 15
analysis:
  # 候选队列容量。达到 70% 暂停初筛并排序，降到 20% 后恢复初筛。
  candidate_pool_size: 100
  initial_assessment_concurrency: 2 # 初始次判断并发数
xianyu:
  state_dir: data/xianyu_states
  account_cooldown_minutes: 60
